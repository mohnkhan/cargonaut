# Cargonaut workspace.
#
# To bootstrap into its own repo:
#   1. Copy this scaffold/ tree to a fresh git repo root
#   2. `cargo build` should produce a runnable `cargonaut` binary (the
#      Phase 1 prototype — dual pane stub + resumable-copy demo)
#   3. Iterate on tasks T1.04+ from specs/.../tasks.md

[workspace]
resolver = "2"
members = [
    "crates/cargonaut-bin",
    "crates/cargonaut-core",
    "crates/cargonaut-ui-tui",
    "crates/cargonaut-vfs",
    "crates/cargonaut-transfer",
    "crates/cargonaut-config",
]

[workspace.package]
version = "0.1.0-pre"
edition = "2021"
rust-version = "1.76"
authors = ["Cargonaut Project"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cargonaut/cargonaut"
homepage = "https://cargonaut.dev"

[workspace.dependencies]
# Async runtime + I/O
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures = "0.3"

# TUI
ratatui = "0.27"
crossterm = "0.28"

# Config
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"

# Path / string utilities
smol_str = "0.3"
smallvec = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Hashing / integrity
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1"

# Bit flags
bitflags = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
