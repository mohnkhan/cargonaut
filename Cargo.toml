# Cargonaut workspace.
#
# Active development follows the per-feature spec-kit workflow: the current
# feature's plan/spec/tasks live under specs/NNN-name/ (pointer in
# .specify/feature.json); dev rules are in CLAUDE.md and
# .specify/memory/constitution.md. `cargo build` produces the `cargonaut`
# binary. (The original multi-phase master plan in design/ is a historical
# archive — see design/README.md.)

[workspace]
resolver = "2"
members = [
    "crates/cargonaut-bin",
    "crates/cargonaut-core",
    "crates/cargonaut-ui-tui",
    "crates/cargonaut-vfs",
    "crates/cargonaut-transfer",
    "crates/cargonaut-config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
authors = ["Cargonaut Project"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cargonaut/cargonaut"
homepage = "https://cargonaut.dev"

[workspace.dependencies]
# Async runtime + I/O
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
futures = "0.3"

# TUI
ratatui = "0.27"
crossterm = "0.28"

# Config
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"

# Path / string utilities
shell-words = "1.1"
smol_str = "0.3"
smallvec = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
globset = "0.4"

# Hashing / integrity
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1"

# Bit flags
bitflags = "2"

# Unix syscalls (file attributes — user/group name resolution; Feature 043)
nix = { version = "0.25", default-features = false, features = ["user"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Testing
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
portable-pty = "0.8"
vt100 = "0.16"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
