# Cargonaut CI — adapted from the MyOS2026 Feature 035 pattern.
#
# Triggers on every push and every PR opened against `main` (incl. fork PRs via
# the safe `pull_request` event — no secrets exposed to PR-author code).
#
# A single rollup job named `ci` is the only required check; branch protection
# on `main` references it. The rollup is green only when every other job
# (lint, unit-test, build, docs-gate) is green.

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs on the same non-main branch when a newer push
# arrives; never auto-cancel runs targeting main so its CI history stays
# complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ---- Lint ----
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---- Unit tests ----
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        # Note: NOT --all-targets — that forces benches with
        # harness=false to be invoked as tests, and the SC/NFR gates
        # in benches/*.rs are calibrated for release builds. Benches
        # are exercised by `cargo bench` ad-hoc (see Learnings Feature
        # 027 for the trap).
        #
        # CARGONAUT_PTY_TESTS=1 enables the binary-level SC-002
        # SIGKILL-resume PTY gate (Feature 037 / issue #29), which
        # otherwise self-skips so local `cargo test` stays fast.
        env:
          CARGONAUT_PTY_TESTS: "1"
        run: cargo test --workspace --lib --tests
      - name: Bundle failure artifacts
        if: failure()
        env:
          CI_FAILED_STEP: "unit-test"
        run: bash scripts/ci/bundle-failure-artifacts.sh "unit-test" "none"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_id }}-unit-test
          path: dist/ci-artifacts/
          retention-days: 30
          if-no-files-found: warn

  # ---- Release build + binary-size gate (NFR-001) ----
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release --workspace
        run: cargo build --release --workspace
      - name: Binary-size check (≤ 8 MiB stripped, per NFR-001)
        run: bash scripts/check-binary-size.sh

  # ---- SFTP live-server integration (issue #84 — SC-003/SC-004) ----
  # The mock-backed unit tests can't exercise a real TCP/SSH/crypto path, so
  # SC-003 (list latency) and SC-004 (transfer throughput) are gated here
  # against a throwaway atmoz/sftp container. Docker is preinstalled on the
  # ubuntu-latest runner; image pull + 10 MiB probe keeps this well under a
  # couple of minutes (the >30 min deferral condition in T041 does not apply).
  sftp-integration:
    name: sftp-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start SFTP fixture (atmoz/sftp on :2222)
        run: docker compose -f docker-compose.ci.yml up -d
      - name: Wait for SFTP port to accept connections
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              exec 3>&- 3<&-
              echo "SFTP port 2222 is open (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::SFTP port 2222 never opened" >&2
          docker compose -f docker-compose.ci.yml logs >&2 || true
          exit 1
      - name: cargo test --release --features ci-integration
        # --release is required for SC-004 to be meaningful: SFTP throughput is
        # bound by symmetric-cipher CPU cost, and an unoptimized debug build runs
        # the crypto several times slower, badly understating real throughput.
        run: |
          cargo test -p cargonaut-vfs --release --features ci-integration \
            --test sftp_integration -- --nocapture
      - name: SFTP fixture logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs || true
      - name: Stop SFTP fixture
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v || true

  # ---- Fuzz smoke (issue #93) ----
  # Bounded coverage-guided fuzz of the parsers. Intentionally NOT part of the
  # `ci` rollup `needs`: the always-on no-panic guarantee is the proptest gate in
  # `unit-test` (which IS required); this heavyweight nightly+cargo-fuzz job is
  # informational so a toolchain hiccup can't block merges. A real crash still
  # turns this job red. CI runners are ephemeral (Constitution §V is dev-host only).
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz each parser (bounded)
        run: |
          for t in vfspath_parse modespec_parse owner_parse; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=20 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  # ---- Docs gate + PR-body gate ----
  docs-gate:
    name: docs-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout (full history for merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run docs-gate
        run: bash scripts/ci/docs-gate.sh
      # PR-body gate: only runs on pull_request events — push events have
      # no PR body to inspect, and the script skips by design when no PR
      # is open.
      - name: Run check-pr-body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/check-pr-body.sh

  # ---- Rollup ----
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, unit-test, build, sftp-integration, docs-gate]
    if: always()
    timeout-minutes: 1
    steps:
      - name: Aggregate result
        env:
          R_LINT:  ${{ needs.lint.result }}
          R_UNIT:  ${{ needs.unit-test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_SFTP:  ${{ needs.sftp-integration.result }}
          R_DOCS:  ${{ needs.docs-gate.result }}
        run: |
          set -e
          declare -A RESULTS=(
            [lint]="$R_LINT"
            [unit-test]="$R_UNIT"
            [build]="$R_BUILD"
            [sftp-integration]="$R_SFTP"
            [docs-gate]="$R_DOCS"
          )
          # Allow-list known-flaky jobs here when needed. Each entry must
          # name the tracking issue. Remove the entry when the bug is fixed.
          declare -A FLAKY=(
            # [job-name]="#NN reason"
          )
          FAILED=()
          FLAKED=()
          for job in "${!RESULTS[@]}"; do
            r="${RESULTS[$job]}"
            case "$r" in
              success) ;;
              *)
                if [ -n "${FLAKY[$job]+x}" ]; then
                  FLAKED+=("${job}=${r} (allowed-flaky: ${FLAKY[$job]})")
                else
                  FAILED+=("${job}=${r}")
                fi
                ;;
            esac
          done
          {
            echo "## CI Rollup"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            for job in "${!RESULTS[@]}"; do
              echo "| ${job} | ${RESULTS[$job]} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#FLAKED[@]}" -gt 0 ]; then
            {
              echo
              echo "### ⚠️ Allowed-flaky jobs (failed but pre-existing)"
              echo
              for f in "${FLAKED[@]}"; do
                echo "- ${f}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Flaked-but-allowed: ${FLAKED[*]}"
          fi
          if [ "${#FAILED[@]}" -gt 0 ]; then
            {
              echo
              echo "### ❌ Failing jobs"
              echo
              for f in "${FAILED[@]}"; do
                echo "- ${f}"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Failed: ${FAILED[*]}"
            exit 1
          fi
          echo "All upstream jobs succeeded (excluding allowed-flaky)."
