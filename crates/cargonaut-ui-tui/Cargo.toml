[package]
name = "cargonaut-ui-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ratatui-based renderer for Cargonaut."

[dependencies]
cargonaut-core = { path = "../cargonaut-core" }
cargonaut-config = { path = "../cargonaut-config" }
cargonaut-vfs = { path = "../cargonaut-vfs" }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
shell-words = { workspace = true }
thiserror = { workspace = true }
strip-ansi-escapes = "0.2"
globset = { workspace = true }
smol_str = { workspace = true }

[dev-dependencies]
humantime = "2"
tempfile = { workspace = true }

[[bench]]
name = "keypress_latency"
harness = false
test = false

[[bench]]
name = "large_dir_scroll"
harness = false
test = false

[[bench]]
name = "theme_resolve"
harness = false
test = false

[[bench]]
name = "help_overlay_render_time"
harness = false
test = false

[[bench]]
name = "viewer_open"
harness = false
test = false

[[bench]]
name = "rss_headroom"
harness = false
test = false
