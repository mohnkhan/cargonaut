[package]
name = "cargonaut-vfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VFS trait + local-filesystem backend for Cargonaut."

[features]
## Archive backends: ZipFs (zip://) and TarFs (tar://). Default-enabled so the
## out-of-the-box binary supports browsing ZIP and TAR archives.
archives = ["dep:zip", "dep:tar", "dep:flate2", "dep:bzip2", "dep:xz2"]
## Remote backends: SftpFs (sftp://) and FtpFs (ftp://). Default-enabled so
## the out-of-the-box binary supports SFTP and FTP connections.
remote = ["dep:russh", "dep:russh-sftp", "dep:suppaftp"]
## Both features enabled by default so `cargonaut` is full-featured without
## any cargo flag.
default = ["archives", "remote"]
## Opt-in: live-server integration tests (tests/sftp_integration.rs). Requires a
## running SFTP server (see docker-compose.ci.yml) on localhost:2222. Never
## enabled by default — plain `cargo test` stays hermetic; only CI's
## sftp-integration job and explicit local runs (`make ci-sftp-up`) turn it on.
## The test builds a client config via the `russh` dev-dependency below. (issue #84)
ci-integration = ["remote"]

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
async-trait = { workspace = true }
serde = { workspace = true }
smol_str = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
bitflags = { workspace = true }
nix = { workspace = true }
tracing = { workspace = true }

# Archives feature deps
# Use deflate-only (pure-Rust via miniz_oxide) to avoid zstd-sys / xz2 C compilation
# in the ZIP reader; bzip2/xz within ZIP archives are rare in practice.
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.1", optional = true }
bzip2 = { version = "0.6", optional = true }
xz2 = { version = "0.1", optional = true }

# Remote feature deps
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"], optional = true }
russh-sftp = { version = "2.1", optional = true }
suppaftp = { version = "8", features = ["tokio"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt"] }
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
# Integration test (tests/sftp_integration.rs, gated by the `ci-integration`
# feature) builds a russh client config to drive the real SftpFs::connect path.
# Integration tests can only name dev-dependencies, so russh is declared here in
# addition to its optional regular-dep entry above; same flags so Cargo unifies.
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }

[[bench]]
name = "archive_listing"
harness = false
