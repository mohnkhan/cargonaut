# ─────────────────────────────────────────────────────────────────────────────
# Success Criteria (measurable outcomes — CI-gated)

[[sc]]
id = "SC-001"
phase = 1
target = "local-local 1 GiB copy ≤ 1.25 × cp(1)"
verification = "benches/local-copy-vs-cp.rs"

[[sc]]
id = "SC-002"
phase = 1
target = "SIGKILL at offset N → resume within 8 MiB; final SHA-256 matches source"
verification = "tests/integration/resume_sigkill.rs"

[[sc]]
id = "SC-003"
phase = 1
target = "3 panes × 10k-entry dirs → RSS ≤ 64 MiB"
verification = "benches/rss-headroom.rs"

[[sc]]
id = "SC-004"
phase = 1
target = "cold launch → first paint ≤ 150 ms; warm ≤ 40 ms"
verification = "benches/startup.rs"

[[sc]]
id = "SC-005"
phase = 2
target = "localhost SFTP throughput ≥ 200 MiB/s for ≥100 MiB files"
verification = "benches/sftp-throughput.rs"

[[sc]]
id = "SC-006"
phase = 3
target = "sandbox-escape fuzzer runs 100k random WASM; zero escapes"
verification = "tests/fuzz/sandbox_escape/"

[[sc]]
id = "SC-007"
phase = 4
target = "10 random destructive ops + 10 undos → bit-identical directory tree"
verification = "tests/integration/undo_sequence.rs"

[[sc]]
id = "SC-008"
phase = 4
target = "audit-log tamper detected on next launch via HMAC-chain verification"
verification = "tests/integration/audit_tamper.rs"

[[sc]]
id = "SC-009"
phase = 6
target = "MC bookmarks importable; --mc-keys passes 30-shortcut checklist"
verification = "tests/integration/mc_migration.rs"

[[sc]]
id = "SC-010"
phase = 6
target = "cargo-tarpaulin ≥ 80% on core crates"
verification = "ci: tarpaulin step"

# ─────────────────────────────────────────────────────────────────────────────
# Non-Functional Requirements

[[nfr]]
id = "NFR-001"
phase = 1
target = "release binary ≤ 8 MiB stripped"
verification = "ci: size check"

[[nfr]]
id = "NFR-002"
phase = 1
target = "first-paint after keypress ≤ 16 ms (60 Hz)"
verification = "benches/keypress-latency.rs"

[[nfr]]
id = "NFR-003"
phase = 1
target = "virtual-scroll 10⁶-entry directory without RSS over FR-009 ceiling"
verification = "benches/large-dir-scroll.rs"

[[nfr]]
id = "NFR-004"
phase = 1
target = "≥ 8 concurrent transfers without UI stalling"
verification = "tests/integration/concurrent_transfers.rs"

[[nfr]]
id = "NFR-005"
phase = 1
target = "no detached background tasks after user cancel"
verification = "tests/integration/cancellation.rs"

[[nfr]]
id = "NFR-006"
phase = 3
target = "plugin sandbox rejects every out-of-cap syscall"
verification = "tests/fuzz/sandbox_escape/"

[[nfr]]
id = "NFR-007"
phase = 6
target = "core crates ≥ 80% coverage; adapter crates ≥ 60%"
verification = "ci: tarpaulin"

[[nfr]]
id = "NFR-008"
phase = "all"
target = "no unsafe in core/ crates without // SAFETY: + unit test"
verification = "ci: clippy-deny-unsafe + grep"
