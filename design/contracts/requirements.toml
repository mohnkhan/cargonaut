# Cargonaut machine-readable requirements manifest.
#
# Every FR/SC/NFR from spec.md is mirrored here as a TOML entry. CI greps
# this file to verify every requirement has a linked test or manual check.
#
# Schema (per entry):
#   id            = "FR-NNN" | "SC-NNN" | "NFR-NNN"
#   priority      = "P1" | "P2" | "P3" | "P4" | "P5" | "P6"
#   phase         = 1..6                       # phase in which it MUST be satisfied
#   acceptance    = "<one-line predicate>"     # human-readable summary
#   verification  = "<test path or CI check>"  # link to enforcement
#   depends_on    = ["FR-X", ...]              # optional, when satisfaction requires prior FRs

